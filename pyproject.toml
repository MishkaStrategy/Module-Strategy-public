[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-strategy-core"
version = "0.4.2"
description = "Deterministic event-driven kernel for modular trading strategies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
modular-backtest = "modular_backtest.cli:main"
modular-signal-bot = "signal_bot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "types-PyYAML>=6.0",
    "build>=1.2",
    "twine>=5.1",
]
backtest = [
    "pyarrow>=16.0",
]
signal-bot = [
    "matplotlib>=3.8",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "cyclonedx-bom>=4.5",
]
release-validation = [
    "jsonschema>=4.23,<5",
    "packaging>=24.2,<27",
]

[project.entry-points."modular_strategy.modules"]
breakout_return = "strategy_modules.breakout_return:BreakoutReturnModule"
fvg_rt_final_15m = "strategy_modules.fvg_rt:FvgRtFinal15mModule"
frozen_1h_short = "strategy_modules.fvg_rt:Frozen1hShortModule"
frozen_4h_short = "strategy_modules.fvg_rt:Frozen4hShortModule"
liquidity_sweep = "strategy_modules.liquidity_sweep:LiquiditySweepModule"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["strategy_modules.risk_sizing", "strategy_modules.risk_sizing.*"]

[tool.setuptools.package-data]
modular_core = ["py.typed"]
modular_backtest = ["py.typed"]
strategy_modules = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "slow: long-running test that is not necessarily a backtest",
    "backtest: historical trading-strategy backtest or backtest-derived research",
    "checkpoint: continuous versus deterministic restart equivalence",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
