name: Python runner preflight
description: Validate a runner workload role and provision an exact Python environment with pinned uv.

inputs:
  role:
    description: Canonical runner workload role.
    required: true
  python-version:
    description: Exact Python minor version, for example 3.12 or 3.13.
    required: true
  cache-dependency-glob:
    description: Files whose content invalidates the shared uv cache.
    required: false
    default: |
      pyproject.toml
      **/pyproject.toml
      **/*requirements*.txt
      **/*requirements*.in
      **/*constraints*.txt
      **/*constraints*.in
      **/uv.lock
  cache-suffix:
    description: Stable dependency-set discriminator for the uv cache key.
    required: false
    default: shared

outputs:
  cache-hit:
    description: Whether the uv dependency cache was restored exactly.
    value: ${{ steps.setup-uv.outputs.cache-hit }}
  python-cache-hit:
    description: Compatibility output; managed Python caching is disabled on persistent self-hosted runners.
    value: ${{ steps.setup-uv.outputs.python-cache-hit }}

runs:
  using: composite
  steps:
    - name: Validate runner role and resources
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/runner_preflight.sh" "${{ inputs.role }}"

    - name: Configure resilient uv transport
      shell: bash
      run: |
        {
          echo "UV_HTTP_RETRIES=5"
          echo "UV_HTTP_CONNECT_TIMEOUT=20"
          echo "UV_HTTP_TIMEOUT=60"
        } >> "$GITHUB_ENV"

    - name: Install pinned uv and restore caches
      id: setup-uv
      continue-on-error: true
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: "0.11.31"
        manifest-file: "data:application/x-ndjson,%7B%22version%22%3A%220.11.31%22%2C%22artifacts%22%3A%5B%7B%22platform%22%3A%22aarch64-apple-darwin%22%2C%22variant%22%3A%22default%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fastral-sh%2Fuv%2Freleases%2Fdownload%2F0.11.31%2Fuv-aarch64-apple-darwin.tar.gz%22%2C%22archive_format%22%3A%22tar.gz%22%2C%22sha256%22%3A%22b2b93e82a6786f9c7cb89fd4ca0e859a147b292ae8f6f95784f9742f0efec39e%22%7D%2C%7B%22platform%22%3A%22x86_64-apple-darwin%22%2C%22variant%22%3A%22default%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fastral-sh%2Fuv%2Freleases%2Fdownload%2F0.11.31%2Fuv-x86_64-apple-darwin.tar.gz%22%2C%22archive_format%22%3A%22tar.gz%22%2C%22sha256%22%3A%2233ee6bd62b57fcd77a499deb54e4432dc1e1a2f3d34930ba987ad8b43f9c7bc7%22%7D%2C%7B%22platform%22%3A%22aarch64-unknown-linux-gnu%22%2C%22variant%22%3A%22default%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fastral-sh%2Fuv%2Freleases%2Fdownload%2F0.11.31%2Fuv-aarch64-unknown-linux-gnu.tar.gz%22%2C%22archive_format%22%3A%22tar.gz%22%2C%22sha256%22%3A%22d74f23949fd07be4970f293d06ca99d87cd2a78a341c3d7b7fc0df7bc2d8a145%22%7D%2C%7B%22platform%22%3A%22x86_64-unknown-linux-gnu%22%2C%22variant%22%3A%22default%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fastral-sh%2Fuv%2Freleases%2Fdownload%2F0.11.31%2Fuv-x86_64-unknown-linux-gnu.tar.gz%22%2C%22archive_format%22%3A%22tar.gz%22%2C%22sha256%22%3A%228cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b%22%7D%5D%7D"
        enable-cache: true
        cache-python: false
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
        cache-suffix: ${{ inputs.cache-suffix }}-py${{ inputs.python-version }}
        cache-local-path: ${{ runner.temp }}/setup-uv-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-py${{ inputs.python-version }}

    - name: Fallback install checksum-verified pinned uv
      if: steps.setup-uv.outcome != 'success'
      shell: bash
      run: |
        set -euo pipefail
        version="0.11.31"
        os="$(uname -s)"
        arch="$(uname -m)"
        case "${os}/${arch}" in
          Darwin/arm64)
            target="aarch64-apple-darwin"
            expected="b2b93e82a6786f9c7cb89fd4ca0e859a147b292ae8f6f95784f9742f0efec39e"
            ;;
          Darwin/x86_64)
            target="x86_64-apple-darwin"
            expected="33ee6bd62b57fcd77a499deb54e4432dc1e1a2f3d34930ba987ad8b43f9c7bc7"
            ;;
          Linux/aarch64|Linux/arm64)
            target="aarch64-unknown-linux-gnu"
            expected="d74f23949fd07be4970f293d06ca99d87cd2a78a341c3d7b7fc0df7bc2d8a145"
            ;;
          Linux/x86_64)
            target="x86_64-unknown-linux-gnu"
            expected="8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b"
            ;;
          *)
            echo "Unsupported uv fallback platform: ${os}/${arch}" >&2
            exit 2
            ;;
        esac

        root="$RUNNER_TEMP/pinned-uv-${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
        archive="$root/uv.tar.gz"
        extract="$root/extract"
        bin="$root/bin"
        rm -rf "$root"
        mkdir -p "$extract" "$bin"
        url="https://github.com/astral-sh/uv/releases/download/${version}/uv-${target}.tar.gz"
        curl --fail --location --silent --show-error \
          --retry 5 --retry-all-errors --retry-delay 5 \
          --connect-timeout 20 --max-time 180 \
          "$url" --output "$archive"

        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$archive" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
        fi
        if [[ "$actual" != "$expected" ]]; then
          echo "Pinned uv checksum mismatch: expected $expected, found $actual" >&2
          exit 1
        fi

        tar -xzf "$archive" -C "$extract"
        source_uv="$(find "$extract" -type f -name uv -print -quit)"
        if [[ -z "$source_uv" ]]; then
          echo "Pinned uv archive did not contain the uv executable" >&2
          exit 1
        fi
        install -m 0755 "$source_uv" "$bin/uv"
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/uv" --version

    - name: Provision exact Python environment
      shell: bash
      run: |
        set -euo pipefail
        requested="${{ inputs.python-version }}"
        case "$requested" in
          3.12|3.13) ;;
          *)
            echo "Unsupported Python version: $requested" >&2
            exit 2
            ;;
        esac

        uv python install "$requested"
        safe_job="$(printf '%s' "$GITHUB_JOB" | tr -c '[:alnum:]_.-' '-')"
        venv="$RUNNER_TEMP/module-strategy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${safe_job}-${requested}"
        for attempt in 1 2 3; do
          rm -rf "$venv"
          if uv venv --python "$requested" --seed "$venv"; then
            break
          fi
          if [[ "$attempt" == 3 ]]; then
            echo "Python environment seeding failed after ${attempt} attempts" >&2
            exit 1
          fi
          echo "Python environment seeding attempt ${attempt} failed; retrying" >&2
          sleep $((attempt * 5))
        done

        echo "$venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
        echo "UV_PROJECT_ENVIRONMENT=$venv" >> "$GITHUB_ENV"

        actual="$("$venv/bin/python" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
        if [[ "$actual" != "$requested" ]]; then
          echo "Provisioned Python mismatch: expected $requested, found $actual" >&2
          exit 1
        fi
        "$venv/bin/python" --version
        "$venv/bin/python" -m pip --version

    - name: Record cache diagnostics
      shell: bash
      run: |
        {
          echo "### Python runner preflight cache"
          echo "- setup-uv outcome: ${{ steps.setup-uv.outcome }}"
          echo "- dependency cache hit: ${{ steps.setup-uv.outputs.cache-hit }}"
          echo "- managed Python cache: disabled"
          echo "- reason: persistent self-hosted runners already provision Python"
          echo "- cache suffix: ${{ inputs.cache-suffix }}-py${{ inputs.python-version }}"
          echo "- local cache path: ${UV_CACHE_DIR:-not-set}"
          echo "- HTTP retries: $UV_HTTP_RETRIES"
          echo "- uv manifest: embedded immutable 0.11.31 release metadata"
          echo "- fallback: official archive with platform-specific SHA-256"
        } >> "$GITHUB_STEP_SUMMARY"
