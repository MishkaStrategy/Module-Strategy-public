      - name: Publish exact canonical backtest evidence
        if: success()
        id: backtest_evidence_publish
        uses: ./.github/actions/publish-release-evidence
        with:
          source_path: ${{ runner.temp }}/canonical-strategy-v2-backtest
          asset_name: canonical-strategy-v2-backtest.tar.gz
          commit_sha: ${{ env.EXPECTED_SHA }}
          draft: "true"
      - name: Enforce canonical backtest publication gate
        if: success()
        run: test "${{ steps.backtest_evidence_publish.outcome }}" = success
      - name: Publish exact modular FVG composition evidence
        if: success()
        id: modular_fvg_composition_evidence_publish
        uses: ./.github/actions/publish-release-evidence
        with:
          source_path: ${{ runner.temp }}/modular-fvg-composition-parity
          asset_name: modular-fvg-composition-parity.tar.gz
          commit_sha: ${{ env.EXPECTED_SHA }}
          draft: "true"
      - name: Enforce modular FVG composition publication gate
        if: success()
        run: test "${{ steps.modular_fvg_composition_evidence_publish.outcome }}" = success
      - name: Publish exact Research Platform evidence
        if: success()
        id: research_evidence_publish
        uses: ./.github/actions/publish-release-evidence
        with:
          source_path: ${{ runner.temp }}/wave2a-canonical-evidence
          asset_name: canonical-strategy-v2-research-platform.tar.gz
          commit_sha: ${{ env.EXPECTED_SHA }}
          draft: "true"
      - name: Enforce Research Platform publication gate
        if: success()
        run: test "${{ steps.research_evidence_publish.outcome }}" = success
      - name: Cleanup canonical strategy temporary data
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/canonical-v2-official-dataset" \
            "$RUNNER_TEMP/canonical-v2-backtest-a" \
            "$RUNNER_TEMP/canonical-v2-backtest-b" \
            "$RUNNER_TEMP/canonical-strategy-v2-backtest" \
            "$RUNNER_TEMP/modular-fvg-composition-parity" \
            "$RUNNER_TEMP/persistent-acceptance" \
            "$RUNNER_TEMP/wave2a-canonical-work" \
            "$RUNNER_TEMP/wave2a-canonical-evidence"
          rm -f \
            "$RUNNER_TEMP/canonical-v2-api-error.txt" \
            "$RUNNER_TEMP/canonical-v2-dataset-command.json" \
            "$RUNNER_TEMP/canonical-v2-registration-command.json" \
            "$RUNNER_TEMP/canonical-v2-command-a.json" \
            "$RUNNER_TEMP/canonical-v2-command-b.json" \
            "$RUNNER_TEMP/modular-fvg-composition-command.json" \
            "$RUNNER_TEMP/wave2a-canonical-command.json"
