              "max_closed_equity_drawdown": 0.1164174394297347,
              "net_return": 0.526631855203826,
              "profit_factor": 1.328366621740268,
              "trade_count": 438,
              "win_rate": 0.3515981735159817,
          }
          if authoritative_report.get("metrics") != expected_metrics:
              raise SystemExit("authoritative parity exact metrics mismatch")
          forbidden = ("/Users/", "/home/", "GoogleDrive-", "My Drive", "Мой диск")
          for path in root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit("Research Platform evidence must not contain symlinks")
              if path.is_file():
                  text = path.read_text(encoding="utf-8")
                  if any(marker in text for marker in forbidden):
