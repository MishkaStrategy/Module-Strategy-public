name: market-data-cli-parity-audit-ci

on:
  pull_request:
    paths:
      - ".github/workflows/market-data-cli-parity-audit-ci.yml"
      - "docs/integration/MARKET_DATA_CLI_PARITY_AUDIT.md"
      - "docs/integration/MARKET_DATA_CLI_PARITY_MATRIX.json"
      - "modules/market_data_ingestion/tests/test_cli_parity_audit.py"
      - "modules/market_data_ingestion/src/market_data_ingestion/cli.py"
      - "modules/market_data_ingestion/src/market_data_application/cli.py"
      - "modules/market_data_ingestion/pyproject.toml"
  push:
    branches:
      - "interface/market-data-cli-parity-audit"
    paths:
      - ".github/workflows/market-data-cli-parity-audit-ci.yml"
      - "docs/integration/MARKET_DATA_CLI_PARITY_AUDIT.md"
      - "docs/integration/MARKET_DATA_CLI_PARITY_MATRIX.json"
      - "modules/market_data_ingestion/tests/test_cli_parity_audit.py"
      - "modules/market_data_ingestion/src/market_data_ingestion/cli.py"
      - "modules/market_data_ingestion/src/market_data_application/cli.py"
      - "modules/market_data_ingestion/pyproject.toml"

permissions:
  contents: write

concurrency:
  group: market-data-cli-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity-audit:
    runs-on: [self-hosted, fast]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONHASHSEED: "0"
      TZ: UTC
    defaults:
      run:
        working-directory: modules/market_data_ingestion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0
          show-progress: false

      - name: Verify exact parity-audit candidate
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: ./.github/actions/python-runner-preflight
        with:
          role: fast
          python-version: ${{ matrix.python-version }}

      - name: Install audit gates
        run: uv pip install -e ".[dev,interface]"

      - name: Compile audit validator
        run: python -m compileall -q tests/test_cli_parity_audit.py

      - name: Ruff audit lint
        run: ruff check --output-format=concise tests/test_cli_parity_audit.py

      - name: Ruff audit format
        run: ruff format --check tests/test_cli_parity_audit.py

      - name: Validate matrix JSON
        run: python -m json.tool ../../docs/integration/MARKET_DATA_CLI_PARITY_MATRIX.json > /dev/null

      - name: Enforce audit-only diff
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'interface/market-data-cli-parity-audit'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess

          allowed = {
              ".github/workflows/market-data-cli-parity-audit-ci.yml",
              "docs/integration/MARKET_DATA_CLI_PARITY_AUDIT.md",
              "docs/integration/MARKET_DATA_CLI_PARITY_MATRIX.json",
              "modules/market_data_ingestion/tests/test_cli_parity_audit.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{os.environ['BASE_SHA']}...HEAD"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"audit-only boundary violated: {unexpected}")
          if changed != allowed:
              raise SystemExit(
                  f"audit evidence incomplete: expected {sorted(allowed)}, got {sorted(changed)}"
              )
          PY

      - name: Run parity validator
        env:
          PYTHONWARNINGS: error::ResourceWarning
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          pytest -o addopts="" -vv -x -ra \
            --timeout=45 --timeout-method=thread \
            tests/test_cli_parity_audit.py 2>&1 \
            | tee reports/cli-parity-${{ matrix.python-version }}.log

      - name: Record parity evidence identity
        if: success()
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          files = sorted(
              (path for path in root.glob("reports/cli-parity-*.log") if path.is_file()),
              key=lambda path: path.as_posix(),
          )
          if not files:
              raise SystemExit("Market Data CLI parity evidence set is empty")

          entries = []
          for path in files:
              data = path.read_bytes()
              entries.append(
                  {
                      "bytes": len(data),
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )

          payload = {
              "exact_head": os.environ["EXPECTED_HEAD"],
              "files": entries,
              "python_version": os.environ["MATRIX_PYTHON_VERSION"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "schema_version": 1,
          }
          canonical = (
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          )
          manifest = root / "reports" / (
              f"cli-parity-evidence-{os.environ['MATRIX_PYTHON_VERSION']}.json"
          )
          manifest.write_text(canonical, encoding="utf-8")
          manifest_sha = hashlib.sha256(canonical.encode("utf-8")).hexdigest()

          print(canonical, end="")
          print(f"MARKET_DATA_CLI_PARITY_EVIDENCE_SHA256={manifest_sha}")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("### Market Data CLI parity evidence identity\n\n")
              handle.write(f"- exact head: `{payload['exact_head']}`\n")
              handle.write(f"- Python: `{payload['python_version']}`\n")
              handle.write(
                  f"- workflow run: `{payload['run_id']}` attempt `{payload['run_attempt']}`\n"
              )
              handle.write(f"- evidence files hashed: `{len(entries)}`\n")
              handle.write(f"- evidence manifest SHA-256: `{manifest_sha}`\n")
              handle.write(
                  "- immutable GitHub Release publication: required after parity validation; "
                  "the parity gate remains blocking\n"
              )
          PY

      - name: Publish exact Market Data CLI parity evidence
        if: success()
        id: evidence_publish
        uses: ./.github/actions/publish-release-evidence
        with:
          source_path: modules/market_data_ingestion/reports
          asset_name: market-data-cli-parity-${{ matrix.python-version }}.tar.gz
          commit_sha: ${{ env.EXPECTED_HEAD }}
          draft: "true"

      - name: Enforce Market Data CLI parity publication gate
        if: success()
        run: test "${{ steps.evidence_publish.outcome }}" = success
