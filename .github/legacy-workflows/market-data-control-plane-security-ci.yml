name: market-data-control-plane-security-ci

on:
  pull_request:
    paths:
      - "modules/market_data_ingestion/src/market_data_application/api.py"
      - "modules/market_data_ingestion/src/market_data_application/server.py"
      - "modules/market_data_ingestion/src/market_data_application/security.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_security.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_store.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_contracts.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_http.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_runtime.py"
      - "modules/market_data_ingestion/tests/test_control_plane_*.py"
      - "modules/market_data_ingestion/tests/test_application_security.py"
      - "modules/market_data_ingestion/tests/test_application_server.py"
      - "modules/market_data_ingestion/docs/adr/0005-authenticated-local-control-plane.md"
      - ".github/workflows/market-data-control-plane-security-ci.yml"
  push:
    branches:
      - "security/market-data-authenticated-control-plane"
    paths:
      - "modules/market_data_ingestion/src/market_data_application/api.py"
      - "modules/market_data_ingestion/src/market_data_application/server.py"
      - "modules/market_data_ingestion/src/market_data_application/security.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_security.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_store.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_contracts.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_http.py"
      - "modules/market_data_ingestion/src/market_data_application/control_plane_runtime.py"
      - "modules/market_data_ingestion/tests/test_control_plane_*.py"
      - "modules/market_data_ingestion/tests/test_application_security.py"
      - "modules/market_data_ingestion/tests/test_application_server.py"
      - "modules/market_data_ingestion/docs/adr/0005-authenticated-local-control-plane.md"
      - ".github/workflows/market-data-control-plane-security-ci.yml"

permissions:
  contents: write

concurrency:
  group: market-data-control-plane-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-core:
    runs-on: [self-hosted, fast]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: modules/market_data_ingestion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
          show-progress: false

      - name: Verify exact security candidate
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: ./.github/actions/python-runner-preflight
        with:
          role: fast
          python-version: ${{ matrix.python-version }}

      - name: Install exact security test surface
        run: |
          uv pip install -e ".[dev,interface]"
          uv pip check

      - name: Compile hardened API and runtime boundary
        run: |
          python -m compileall -q \
            src/market_data_application/api.py \
            src/market_data_application/server.py \
            src/market_data_application/security.py \
            src/market_data_application/control_plane_security.py \
            src/market_data_application/control_plane_store.py \
            src/market_data_application/control_plane_contracts.py \
            src/market_data_application/control_plane_http.py \
            src/market_data_application/control_plane_runtime.py \
            tests/test_control_plane_security_core.py \
            tests/test_control_plane_security_edges.py \
            tests/test_control_plane_http.py \
            tests/test_control_plane_runtime.py \
            tests/test_control_plane_api_integration.py \
            tests/test_control_plane_server_integration.py \
            tests/test_application_security.py \
            tests/test_application_server.py

      - name: Ruff lint and format
        run: |
          files=(
            src/market_data_application/api.py
            src/market_data_application/server.py
            src/market_data_application/security.py
            src/market_data_application/control_plane_security.py
            src/market_data_application/control_plane_store.py
            src/market_data_application/control_plane_contracts.py
            src/market_data_application/control_plane_http.py
            src/market_data_application/control_plane_runtime.py
            tests/test_control_plane_security_core.py
            tests/test_control_plane_security_edges.py
            tests/test_control_plane_http.py
            tests/test_control_plane_runtime.py
            tests/test_control_plane_api_integration.py
            tests/test_control_plane_server_integration.py
            tests/test_application_security.py
            tests/test_application_server.py
          )
          ruff check --output-format=concise "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Strict MyPy
        run: |
          mypy \
            src/market_data_application/security.py \
            src/market_data_application/control_plane_security.py \
            src/market_data_application/control_plane_store.py \
            src/market_data_application/control_plane_contracts.py \
            src/market_data_application/control_plane_http.py \
            src/market_data_application/control_plane_runtime.py \
            src/market_data_application/api.py \
            src/market_data_application/server.py

      - name: Hardened API tests and branch coverage
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          coverage erase
          coverage run --branch \
            --source=market_data_application.control_plane_security,market_data_application.control_plane_store,market_data_application.control_plane_contracts,market_data_application.control_plane_http,market_data_application.control_plane_runtime \
            -m pytest -o addopts="" -ra \
              tests/test_control_plane_security_core.py \
              tests/test_control_plane_security_edges.py \
              tests/test_control_plane_http.py \
              tests/test_control_plane_runtime.py \
              tests/test_control_plane_api_integration.py \
              tests/test_control_plane_server_integration.py \
              tests/test_application_security.py \
              tests/test_application_server.py
          coverage report --fail-under=90
          coverage xml -o reports/control-plane-security-${{ matrix.python-version }}.xml

      - name: Build and clean wheel smoke
        run: |
          python -m build
          python -m twine check dist/*
          uv venv .venv-control-plane-wheel --python "${{ matrix.python-version }}"
          uv pip install --python .venv-control-plane-wheel/bin/python \
            dist/*.whl \
            "fastapi>=0.115,<1" \
            "typer>=0.16,<1" \
            "rich>=13.7,<15" \
            "uvicorn>=0.30,<1"
          uv pip check --python .venv-control-plane-wheel/bin/python
          .venv-control-plane-wheel/bin/python - <<'PY'
          from market_data_application.api import create_api
          from market_data_application.control_plane_contracts import TokenReloadRequest
          from market_data_application.control_plane_http import ControlPlaneSecurityController
          from market_data_application.control_plane_runtime import control_plane_from_environment
          from market_data_application.control_plane_security import ApiTokenRecord
          from market_data_application.control_plane_store import SQLiteControlPlaneStore
          from market_data_application.server import create_server

          assert ApiTokenRecord is not None
          assert ControlPlaneSecurityController is not None
          assert SQLiteControlPlaneStore is not None
          assert TokenReloadRequest is not None
          assert control_plane_from_environment is not None
          assert create_api is not None
          assert create_server is not None
          PY

      - name: Secret non-disclosure source scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E \
            '(OLD_ADMIN_TOKEN|NEW_ADMIN_TOKEN|READER_TOKEN|ADMIN_OLD|ADMIN_NEW)[[:space:]]*=' \
            src/market_data_application

      - name: Record control-plane security evidence identity
        if: success()
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          candidates = sorted(
              {
                  root / "reports" / f"control-plane-security-{os.environ['MATRIX_PYTHON_VERSION']}.xml",
                  *root.glob("dist/*"),
              },
              key=lambda path: path.as_posix(),
          )
          files = [path for path in candidates if path.is_file()]
          if len(files) < 3:
              raise SystemExit("Control-plane security evidence set is incomplete")

          entries = []
          for path in files:
              data = path.read_bytes()
              entries.append(
                  {
                      "bytes": len(data),
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )

          payload = {
              "exact_head": os.environ["EXPECTED_HEAD"],
              "files": entries,
              "python_version": os.environ["MATRIX_PYTHON_VERSION"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "schema_version": 1,
          }
          manifest = root / "reports" / (
              f"control-plane-security-evidence-{os.environ['MATRIX_PYTHON_VERSION']}.json"
          )
          canonical = (
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          )
          manifest.write_text(canonical, encoding="utf-8")
          manifest_sha = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          print(canonical, end="")
          print(f"MARKET_DATA_CONTROL_PLANE_SECURITY_EVIDENCE_SHA256={manifest_sha}")
          PY

      - name: Publish exact control-plane security evidence
        if: success()
        id: evidence_publish
        uses: ./.github/actions/publish-release-evidence
        with:
          source_path: |
            modules/market_data_ingestion/reports/control-plane-security-${{ matrix.python-version }}.xml
            modules/market_data_ingestion/reports/control-plane-security-evidence-${{ matrix.python-version }}.json
            modules/market_data_ingestion/dist
          asset_name: market-data-control-plane-security-${{ matrix.python-version }}.tar.gz
          commit_sha: ${{ env.EXPECTED_HEAD }}
          draft: "true"

      - name: Enforce control-plane security publication gate
        if: success()
        run: test "${{ steps.evidence_publish.outcome }}" = success

      - name: Upload control-plane security failure diagnostics
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-data-control-plane-security-diagnostics-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            modules/market_data_ingestion/reports/control-plane-security-*.xml
            modules/market_data_ingestion/dist/*
          if-no-files-found: warn
