name: signal-bot-v0-6-integration

on:
  pull_request:
    branches:
      - integration/modular-strategy-v0.6.0-rc
    paths:
      - "src/signal_bot/**"
      - "tests/signal_bot/**"
      - "configs/signal_bot.example.yaml"
      - "benchmarks/signal_bot_orchestrator.py"
      - "scripts/signal_bot_identity_smoke.py"
      - ".github/workflows/signal-bot*.yml"
      - "pyproject.toml"
      - ".env.example"
      - ".gitignore"
      - "README.md"
      - "HOW_TO_ADD_TRADING_PAIR.md"
      - "docs/signal_bot/**"
  push:
    branches:
      - integration/modular-strategy-v0.6.0-rc
    paths:
      - "src/signal_bot/**"
      - "tests/signal_bot/**"
      - "configs/signal_bot.example.yaml"
      - "benchmarks/signal_bot_orchestrator.py"
      - "scripts/signal_bot_identity_smoke.py"
      - ".github/workflows/signal-bot*.yml"
      - "pyproject.toml"
      - ".env.example"
      - ".gitignore"
      - "README.md"
      - "HOW_TO_ADD_TRADING_PAIR.md"
      - "docs/signal_bot/**"

permissions:
  contents: read

concurrency:
  group: signal-bot-v0-6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Signal Bot v0.6 integration / Python ${{ matrix.python-version }}
    runs-on: [self-hosted, fast]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      CENTRAL_SHA: a7253da137396b13c531445bf238c676432998d4
      REMEDIATION_SHA: c32f5f64ba0d4ec7b8d984760fef2fa4acbbf6ec
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "946684800"
      REPORT_DIR: reports/signal-bot-v0-6/py${{ matrix.python-version }}
    steps:
      - name: Runner diagnostics
        run: echo "runner.name=$RUNNER_NAME runner.os=$RUNNER_OS runner.arch=$RUNNER_ARCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Verify combined candidate ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CENTRAL_SHA" HEAD
          git merge-base --is-ancestor "$REMEDIATION_SHA" HEAD
          git diff --check
          mkdir -p "$REPORT_DIR"
          git rev-parse HEAD > "$REPORT_DIR/commit-sha.txt"
          git rev-list --parents -n 1 HEAD > "$REPORT_DIR/head-parents.txt"
          git diff --name-status "$CENTRAL_SHA"...HEAD > "$REPORT_DIR/changed-files.txt"
      - name: Set up pinned uv and isolated Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.31"
          manifest-file: "data:application/x-ndjson,%7B%22version%22%3A%220.11.31%22%2C%22artifacts%22%3A%5B%7B%22platform%22%3A%22aarch64-apple-darwin%22%2C%22variant%22%3A%22default%22%2C%22url%22%3A%22https%3A%2F%2Freleases.astral.sh%2Fgithub%2Fuv%2Freleases%2Fdownload%2F0.11.31%2Fuv-aarch64-apple-darwin.tar.gz%22%2C%22archive_format%22%3A%22tar.gz%22%2C%22sha256%22%3A%22b2b93e82a6786f9c7cb89fd4ca0e859a147b292ae8f6f95784f9742f0efec39e%22%7D%2C%7B%22platform%22%3A%22x86_64-apple-darwin%22%2C%22variant%22%3A%22default%22%2C%22url%22%3A%22https%3A%2F%2Freleases.astral.sh%2Fgithub%2Fuv%2Freleases%2Fdownload%2F0.11.31%2Fuv-x86_64-apple-darwin.tar.gz%22%2C%22archive_format%22%3A%22tar.gz%22%2C%22sha256%22%3A%2233ee6bd62b57fcd77a499deb54e4432dc1e1a2f3d34930ba987ad8b43f9c7bc7%22%7D%2C%7B%22platform%22%3A%22aarch64-unknown-linux-gnu%22%2C%22variant%22%3A%22default%22%2C%22url%22%3A%22https%3A%2F%2Freleases.astral.sh%2Fgithub%2Fuv%2Freleases%2Fdownload%2F0.11.31%2Fuv-aarch64-unknown-linux-gnu.tar.gz%22%2C%22archive_format%22%3A%22tar.gz%22%2C%22sha256%22%3A%22d74f23949fd07be4970f293d06ca99d87cd2a78a341c3d7b7fc0df7bc2d8a145%22%7D%2C%7B%22platform%22%3A%22x86_64-unknown-linux-gnu%22%2C%22variant%22%3A%22default%22%2C%22url%22%3A%22https%3A%2F%2Freleases.astral.sh%2Fgithub%2Fuv%2Freleases%2Fdownload%2F0.11.31%2Fuv-x86_64-unknown-linux-gnu.tar.gz%22%2C%22archive_format%22%3A%22tar.gz%22%2C%22sha256%22%3A%228cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b%22%7D%5D%7D"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false
      - name: Install combined v0.6 surface
        run: |
          set -euo pipefail
          uv pip install --upgrade pip setuptools wheel
          uv pip install -e '.[dev,signal-bot]'
          uv pip install -e ./modules/session_range
          uv pip install -e ./modules/setup_adapter
          uv pip install -e ./modules/entry_model
          uv pip install -e ./modules/protection_target
          uv pip install -e ./modules/risk_sizing
          uv pip install -e ./modules/position_scaling
          uv pip install -e ./modules/trade_plan_router
          uv pip install -e './modules/paper_execution[dev]'
          uv pip install -e './modules/position_exit_management[dev]'
          uv pip install -e './applications/trading_runner[dev]'
          uv pip install build twine
          uv pip check | tee "$REPORT_DIR/pip-check.txt"
          python -VV > "$REPORT_DIR/python.txt"
          python -m pip freeze > "$REPORT_DIR/pip-freeze.txt"
      - name: Collect static diagnostics
        run: |
          set +e
          python -m compileall -q src/signal_bot tests/signal_bot >"$REPORT_DIR/compile.txt" 2>&1
          echo "$?" >"$REPORT_DIR/compile.exit"
          ruff check src/signal_bot tests/signal_bot >"$REPORT_DIR/ruff-check.txt" 2>&1
          echo "$?" >"$REPORT_DIR/ruff-check.exit"
          ruff format --check src/signal_bot tests/signal_bot >"$REPORT_DIR/ruff-format.txt" 2>&1
          echo "$?" >"$REPORT_DIR/ruff-format.exit"
          mypy src/signal_bot >"$REPORT_DIR/mypy.txt" 2>&1
          echo "$?" >"$REPORT_DIR/mypy.exit"
          exit 0
      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signal-bot-v0-6-static-py${{ matrix.python-version }}
          if-no-files-found: error
          path: reports/signal-bot-v0-6/py${{ matrix.python-version }}/**
      - name: Enforce static gate
        run: |
          set -euo pipefail
          failures=()
          for path in "$REPORT_DIR"/*.exit; do
            code="$(cat "$path")"
            if [[ "$code" != "0" ]]; then
              failures+=("$(basename "$path"): exit $code")
            fi
          done
          if (( ${#failures[@]} )); then
            printf '%s\n' "${failures[@]}"
            exit 1
          fi
      - name: Run Signal Bot tests and coverage
        run: |
          set -euo pipefail
          coverage erase
          coverage run --branch --source=src/signal_bot -m pytest -m "not slow" tests/signal_bot \
            --junitxml="$REPORT_DIR/signal-bot.xml"
          coverage json --pretty-print --show-contexts -o "$REPORT_DIR/coverage.json"
          coverage report -m --fail-under=90 | tee "$REPORT_DIR/coverage.txt"
      - name: Verify frozen Core and cross-layer contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_core_contract_freeze.py \
            tests/test_core_module_integration_harness.py \
            tests/integration/test_v0_6_executable_acceptance.py \
            tests/integration/test_v0_6_intrabar_acceptance.py \
            tests/integration/test_v0_6_position_exit_manifest_compatibility.py \
            --junitxml="$REPORT_DIR/central-contracts.xml"
      - name: Verify Trading Runner and Paper Execution
        run: |
          set -euo pipefail
          python -m pytest -q applications/trading_runner/tests \
            --junitxml="$REPORT_DIR/trading-runner.xml"
          python scripts/paper_execution_component_gate.py
      - name: Verify Position and Exit frozen-Core profile
        run: |
          set -euo pipefail
          expression="not test_invalid_position_snapshot_is_rejected_before_cursor_mutation and not test_naive_position_time_is_rejected_before_cursor_mutation and not test_malformed_position_fields_fail_before_state_mutation and not test_malformed_view_fields_fail_before_state_mutation and not test_non_sequence_market_bars_fail_before_state_mutation and not test_non_candle_current_value_fails_before_state_mutation and not test_position_values_must_fit_public_float_transport_before_state_mutation"
          python -m pytest -q \
            modules/position_exit_management/tests \
            tests/integration/test_v0_6_position_exit_manifest_compatibility.py \
            -k "$expression" \
            --junitxml="$REPORT_DIR/position-exit.xml"
      - name: Benchmark and package smoke
        run: |
          set -euo pipefail
          python benchmarks/signal_bot_orchestrator.py --pairs 50 --cycles 1000 \
            | tee "$REPORT_DIR/benchmark.json"
          rm -rf dist/signal-bot-root
          python -m build --wheel --outdir dist/signal-bot-root
          twine check dist/signal-bot-root/* | tee "$REPORT_DIR/package-check.txt"
          wheel="$(find dist/signal-bot-root -maxdepth 1 -type f -name '*.whl' -print)"
          test "$(printf '%s\n' "$wheel" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          uv venv --python "${{ matrix.python-version }}" .signal-bot-clean
          uv pip install --python .signal-bot-clean/bin/python "${wheel}[signal-bot]"
          uv pip check --python .signal-bot-clean/bin/python
          .signal-bot-clean/bin/python - <<'PY'
          import modular_core
          import signal_bot
          import signal_bot.cli
          from signal_bot.config import load_config

          assert modular_core.__version__ == "0.4.2"
          load_config("configs/signal_bot.example.yaml")
          print(signal_bot.__name__)
          PY
      - name: Record evidence hashes
        if: always()
        run: |
          set -euo pipefail
          find "$REPORT_DIR" -type f -print0 2>/dev/null \
            | sort -z | xargs -0 shasum -a 256 > "$REPORT_DIR/evidence-sha256.txt" || true
          find dist/signal-bot-root -type f -print0 2>/dev/null \
            | sort -z | xargs -0 shasum -a 256 > "$REPORT_DIR/package-sha256.txt" || true
      - name: Upload exact integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signal-bot-v0-6-py${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            reports/signal-bot-v0-6/py${{ matrix.python-version }}/**
            reports/paper_execution/**
            dist/paper_execution-component/**
            dist/signal-bot-root/**
