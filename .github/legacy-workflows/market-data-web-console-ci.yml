name: market-data-web-console-ci

on:
  push:
    branches:
      - interface/market-data-web-console
      - interface/market-data-web-cli
    paths:
      - "web/market-data-console/**"
      - ".github/workflows/market-data-web-console-ci.yml"
  pull_request:
    paths:
      - "web/market-data-console/**"
      - ".github/workflows/market-data-web-console-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-data-web-console-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: [self-hosted, fast]
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: web/market-data-console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact frontend candidate
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Provision exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.12.0"
      - name: Validate Node
        run: |
          node --version
          npm --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 12)) process.exit(1)'
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            log="npm-audit-attempt-${attempt}.log"
            set +e
            npm audit --omit=dev --audit-level=high 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if (( status == 0 )); then
              exit 0
            fi

            if ! grep -Eiq \
              'audit endpoint returned an error|Client network socket disconnected|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENETUNREACH|ESOCKETTIMEDOUT|ERR_SOCKET|HTTP (429|5[0-9]{2})' \
              "$log"; then
              echo "npm audit reported a substantive failure; not retrying" >&2
              exit "$status"
            fi
            if (( attempt == max_attempts )); then
              echo "npm audit transport failure persisted after ${max_attempts} attempts" >&2
              exit "$status"
            fi
            sleep $((5 * 2 ** (attempt - 1)))
          done
      - name: Browser security boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'localStorage|sessionStorage|document\.cookie|indexedDB|dangerouslySetInnerHTML|\beval\(' src; then
            echo 'Forbidden browser persistence or dynamic code primitive found' >&2
            exit 1
          fi
          if grep -R -n -E "credentials[[:space:]]*:[[:space:]]*['\"](same-origin|include)['\"]" src; then
            echo 'Ambient browser cookie credential mode found' >&2
            exit 1
          fi
          if grep -R -n '0\.0\.0\.0' src vite.config.ts; then
            echo 'External bind literal found' >&2
            exit 1
          fi
          grep -q '127.0.0.1' vite.config.ts
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload console evidence
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-data-web-console-${{ github.sha }}
          path: |
            web/market-data-console/dist
            web/market-data-console/npm-audit-attempt-*.log
          if-no-files-found: warn
