[[suites]]
name = "root"
component = "Core, Backtest Engine, root integration, Breakout-Return, Risk Sizing and Signal Bot"
working_directory = "."
paths = ["tests"]
pytest_args = ["--import-mode=importlib"]
required_imports = ["pytest", "yaml", "hypothesis", "pyarrow"]
install_hint = "python -m pip install -e '.[dev,backtest,signal-bot]'"
runtime_class = "medium"
ci_frequency = "pull_request"
categories = ["unit", "integration", "regression", "property"]
external_dependencies = []

