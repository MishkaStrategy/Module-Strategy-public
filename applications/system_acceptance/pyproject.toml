[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-system-acceptance"
version = "0.1.0"
description = "Durable application-level acceptance and soak orchestration owner"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
package-runtime-owner = [
    "modular-strategy-factory>=0.1,<0.2",
    "modular-strategy-risk-request-composer>=0.1,<0.2",
    "modular-strategy-risk-sizing>=1.2,<1.3",
    "modular-strategy-trade-plan-router>=0.1,<0.2",
    "modular-trading-runner>=0.1,<0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.10",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modular_system_acceptance = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
