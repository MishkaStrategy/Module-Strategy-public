[mypy]
python_version = 3.12
check_untyped_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True

# Cooperative mixins receive these attributes through the final FvgModule MRO.
[mypy-modular_strategy_fvg.module_feature_boundaries,modular_strategy_fvg.module_features,modular_strategy_fvg.module_init,modular_strategy_fvg.module_onbar,modular_strategy_fvg.module_processing,modular_strategy_fvg.module_restore,modular_strategy_fvg.module_runtime,modular_strategy_fvg.module_state,modular_strategy_fvg.module_support]
disable_error_code = attr-defined

# Config overrides are key-validated before dynamic dataclass replacement.
[mypy-modular_strategy_fvg.config]
disable_error_code = arg-type, unused-ignore

# Candle adapter attributes are validated before conversion to canonical runtime values.
[mypy-modular_strategy_fvg.detector]
disable_error_code = arg-type, assignment, no-any-return

# Checkpoint payload fields and optional lifecycle timestamps are validated at runtime.
[mypy-modular_strategy_fvg.lifecycle]
disable_error_code = arg-type, operator

[mypy-modular_strategy_fvg.models_base]
disable_error_code = arg-type

[mypy-modular_strategy_fvg.models_filters]
disable_error_code = arg-type, unused-ignore

[mypy-modular_strategy_fvg.models_pre]
disable_error_code = arg-type

# Pre-FVG provisional candles intentionally implement a runtime structural protocol.
[mypy-modular_strategy_fvg.pre_fvg]
disable_error_code = arg-type, operator

[mypy-modular_strategy_fvg.analysis]
disable_error_code = arg-type, operator

[mypy-modular_strategy_fvg.evaluator]
disable_error_code = arg-type

[mypy-modular_strategy_fvg.filters]
disable_error_code = arg-type

# Restore/runtime boundaries validate generic checkpoint and feature payloads before use.
[mypy-modular_strategy_fvg.module_restore]
disable_error_code = attr-defined, no-any-return, assignment

[mypy-modular_strategy_fvg.module_runtime]
disable_error_code = attr-defined, arg-type, index, assignment

[mypy-modular_strategy_fvg.module_feature_boundaries]
disable_error_code = attr-defined, assignment

[mypy-modular_strategy_fvg.module_features]
disable_error_code = attr-defined, no-any-return

[mypy-modular_strategy_fvg.module_onbar]
disable_error_code = attr-defined, arg-type

[mypy-modular_strategy_fvg.module_state]
disable_error_code = attr-defined, arg-type

# StrategyModule exposes manifest through the final concrete module contract.
[mypy-modular_strategy_fvg.module]
disable_error_code = misc
