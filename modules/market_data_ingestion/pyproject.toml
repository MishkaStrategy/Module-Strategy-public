[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-market-data-ingestion"
version = "0.4.0"
description = "Historical market data ingestion for Modular Strategy"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=16.0"]
interface = [
  "fastapi>=0.115,<1",
  "typer>=0.16,<1",
  "rich>=13.7,<15",
  "uvicorn>=0.30,<1",
]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "coverage>=7.0",
  "build>=1.2",
  "twine>=5.0",
  "httpx>=0.27,<1",
]

[project.scripts]
market-data = "market_data_ingestion.cli:main"
market-data-v1 = "market_data_application.cli:main"
market-data-v1-migrate = "market_data_application.migration_cli:main"
market-data-api = "market_data_application.server:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_data_ingestion = ["py.typed"]
market_data_application = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["market_data_ingestion", "market_data_application"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true


[tool.coverage.run]
branch = true
source = ["market_data_ingestion", "market_data_application"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
