[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-session-range"
version = "0.2.0"
description = "DST-aware, gap-safe Session Range module for Modular Strategy Core"
requires-python = ">=3.12"
dependencies = ["modular-strategy-core>=0.4,<0.5"]
readme = "README.md"
license = "LicenseRef-Proprietary"

[project.entry-points."modular_strategy.modules"]
session_range = "modular_session_range:SessionRangeModule"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "coverage>=7,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modular_session_range = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
