plan_ttl_seconds: 300
max_portfolio_risk_fraction: 0.03
max_symbol_notional_fraction: 3.0
max_entry_candidates: 1000
max_decisions_per_type: 2000
max_portfolio_positions: 5000
max_pending_orders: 10000
max_targets_per_plan: 100
portfolio_priorities: {}
strategy_priorities: {}
setup_priorities: {}
module_priorities: {}
side_priorities:
  long: 0
  short: 0
warning_escalation: false
audit_level: full
