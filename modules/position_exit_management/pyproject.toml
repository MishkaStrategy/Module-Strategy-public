[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-strategy-position-exit-management"
version = "0.2.1"
description = "Deterministic open-position, partial-exit, breakeven, trailing and cleanup module for Modular Strategy Core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["modular-strategy-core>=0.4,<0.5"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "coverage>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.10,<2",
  "hypothesis>=6,<7",
  "bandit>=1.7,<2",
  "build>=1,<2",
]

[project.entry-points."modular_strategy.modules"]
position_exit_management = "modular_strategy_position_exit_management:PositionExitManagementModule"

[tool.setuptools.package-data]
modular_strategy_position_exit_management = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["modular_strategy_position_exit_management"]

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
